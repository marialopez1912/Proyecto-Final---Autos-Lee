<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<f:metadata>
    <f:viewAction action="#{gastosUI.iniciar}"/>
</f:metadata>
<h:head>
    <title>Control de gastos</title>
    <h:outputStylesheet name="estadisticas.css"/>
</h:head>
<h:body>
    <header>Autos Lee</header>
    <div class="layout">
        <main>
            <h2>Control de gastos</h2>
            <h:form id="formGastos">
                <p:selectOneMenu value="#{gastosUI.tipo}">
                    <f:selectItem itemLabel="Por tipo de gasto" itemValue="tipo"/>
                    <f:selectItem itemLabel="Por marca" itemValue="marca"/>
                    <p:ajax listener="#{gastosUI.cargar}" update="panel"/>
                </p:selectOneMenu>

                <h:panelGroup id="panel" layout="block">
                    <h:outputText styleClass="aviso" value="No hay gastos registrados."
                                  rendered="#{empty gastosUI.filas}"/>

                    <p:chart type="bar" model="#{gastosUI.modelo}"
                             style="width:600px;height:320px"
                             rendered="#{not empty gastosUI.filas}"/>

                    <p:dataTable value="#{gastosUI.filas}" var="f"
                                 rendered="#{not empty gastosUI.filas}">
                        <p:column headerText="Categoría">
                            <h:outputText value="#{f.etiqueta}"/>
                        </p:column>
                        <p:column headerText="Total">
                            <h:outputText value="#{f.total}">
                                <f:convertNumber type="currency" currencySymbol="$"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>

                    <p><strong>Total general: </strong>
                        <h:outputText value="#{gastosUI.totalGeneral}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p>
                </h:panelGroup>
            </h:form>
        </main>
        <ui:include src="menu.xhtml"/>
    </div>
</h:body>
</html>
