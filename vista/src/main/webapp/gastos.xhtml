<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/plantilla.xhtml">

    <ui:define name="metadata">
        <f:viewAction action="#{gastosUI.iniciar}"/>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h2>Control de gastos</h2>

            <h:form id="formGastos">
                <p:selectOneButton value="#{gastosUI.tipo}">
                    <f:selectItem itemLabel="Por tipo de gasto" itemValue="tipo"/>
                    <f:selectItem itemLabel="Por marca" itemValue="marca"/>
                    <p:ajax listener="#{gastosUI.cargar}" update="formGastos"/>
                </p:selectOneButton>

                <h:panelGroup rendered="#{empty gastosUI.filas}" layout="block" styleClass="aviso">
                    No hay gastos registrados.
                </h:panelGroup>

                <ui:repeat value="#{gastosUI.filas}" var="f">
                    <div class="barra-fila">
                        <span class="barra-etiqueta">#{f.etiqueta}</span>
                        <div class="barra-fondo">
                            <div class="barra" style="width: #{gastosUI.porcentaje(f)}%"></div>
                        </div>
                        <span class="barra-monto">
                            <h:outputText value="#{f.total}">
                                <f:convertNumber type="currency" currencySymbol="$"/>
                            </h:outputText>
                        </span>
                    </div>
                </ui:repeat>

                <p class="total-general">Total:
                    <h:outputText value="#{gastosUI.totalGeneral}">
                        <f:convertNumber type="currency" currencySymbol="$"/>
                    </h:outputText>
                </p>
            </h:form>
        </div>
    </ui:define>

    <ui:define name="menu">

        <aside class="menu">

            <h3>Administración</h3>

            <h:link outcome="panel.xhtml" value="Inicio"/>

            <span class="titulo-sub">Administradores</span>

            <h:link styleClass="sub"
                    outcome="administradores.xhtml"
                    value="Consultar administradores"/>

            <h:panelGroup rendered="#{loginUI.administrador.esPrincipal}">
                <h:link styleClass="sub"
                        outcome="registroAdministrador.xhtml"
                        value="Registrar administrador"/>
            </h:panelGroup>

            <span class="titulo-sub">Usuarios</span>

            <h:outputText styleClass="sub" value="Consultar usuarios"/>
            <h:outputText styleClass="sub" value="Administrar usuarios"/>

            <span class="titulo-sub">Estadísticas</span>

            <h:link styleClass="sub"
                    outcome="gastos.xhtml"
                    value="Control de gastos"/>

            <h:link styleClass="sub"
                    outcome="ventas.xhtml"
                    value="Reportes de ventas"/>

            <span class="titulo-sub">Cuenta</span>

            <h:outputText styleClass="sub"
                          value="#{loginUI.administrador.nombre}"/>

        </aside>

    </ui:define>

</ui:composition>
