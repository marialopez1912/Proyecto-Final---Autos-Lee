<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:jsf="jakarta.faces">
<head jsf:id="head">
    <meta charset="UTF-8" />
    <title>Autos Lee - Registro de Usuario</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f2f2f2;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-family: 'Georgia', serif;
            font-size: 24px;
            color: #1a1a1a;
            text-decoration: none;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            color: #8b2525;
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            width: 100%;
        }

        .content-wrapper {
            width: 100%;
            max-width: 650px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #555555;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #8b2525;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 15px;
            color: #555555;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background-color: #dcdcdc;
            margin-bottom: 30px;
            width: 100%;
        }

        .form-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group-full {
            grid-column: span 2;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #8b2525;
        }

        .messages-area {
            margin-bottom: 16px;
            font-size: 14px;
        }

        .btn-container {
            display: flex;
            justify-content: flex-start;
            margin-top: 10px;
        }

        .btn-submit {
            background-color: #8b2525;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #6e1d1d;
        }
    </style>
</head>
<body jsf:id="body">

<div class="header">
    <a href="login.xhtml" class="header-title">Autos Lee</a>

</div>

<div class="main-container">
    <div class="content-wrapper">
        <a href="login.xhtml" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Regresar al inicio de sesión</span>
        </a>

        <h1 class="page-title">Registro de usuarios</h1>
        <p class="page-subtitle">Crea tu cuenta para ingresar a Autos Lee.</p>
        <div class="divider"></div>

        <div class="form-card">
            <form jsf:id="formRegistro">
                <div class="messages-area">
                    <h:messages globalOnly="true" style="color: #8b2525; list-style: none;" />
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre *</label>
                        <input type="text" id="nombre" jsf:id="nombre" jsf:value="#{registroUsuario.nombre}" class="form-input" required="required" />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="apellidoPaterno">Apellido Paterno *</label>
                        <input type="text" id="apellidoPaterno" jsf:id="apellidoPaterno" jsf:value="#{registroUsuario.apellidoPaterno}" class="form-input" required="required" />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="apellidoMaterno">Apellido Materno</label>
                        <input type="text" id="apellidoMaterno" jsf:id="apellidoMaterno" jsf:value="#{registroUsuario.apellidoMaterno}" class="form-input" />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="usuario">Usuario *</label>
                        <input type="text" id="usuario" jsf:id="usuario" jsf:value="#{registroUsuario.usuario}" class="form-input" required="required" />
                    </div>

                    <div class="form-group-full form-group">
                        <label class="form-label" for="correo">E-mail *</label>
                        <input type="email" id="correo" jsf:id="correo" jsf:value="#{registroUsuario.correoElectronico}" class="form-input" required="required" />
                    </div>

                    <div class="form-group-full form-group">
                        <label class="form-label" for="contrasenia">Contraseña *</label>
                        <input type="password" id="contrasenia" jsf:id="contrasenia" jsf:value="#{registroUsuario.contrasenia}" class="form-input" required="required" minlength="6" />
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" jsf:id="btnReg" jsf:action="#{registroUsuario.registrar}" class="btn-submit">Registrar usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
