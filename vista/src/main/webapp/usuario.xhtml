<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla.xhtml">

    <ui:define name="metadata">
        <f:viewAction action="#{inicioUI.iniciarUsuario}"/>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h2>Autos disponibles</h2>

            <h:panelGroup rendered="#{empty inicioUI.autos}" layout="block" styleClass="aviso">
                <i class="pi pi-car"></i>
                <span>No hay autos registrados.</span>
            </h:panelGroup>

            <div class="rejilla">
                <ui:repeat value="#{inicioUI.autos}" var="a">
                    <div class="auto-card">
                        <div class="auto-foto"><i class="pi pi-car"></i></div>
                        <div class="auto-nombre">#{a.marca} #{a.modelo} #{a.anio}</div>
                        <div class="auto-precio">
                            Precio
                            <strong>
                                <h:outputText value="#{a.precio}">
                                    <f:convertNumber type="currency" currencySymbol="$"/>
                                </h:outputText> MXN
                            </strong>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </div>
    </ui:define>
</ui:composition>
