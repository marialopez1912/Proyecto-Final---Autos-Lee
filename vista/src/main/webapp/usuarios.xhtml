<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/panel.xhtml">

    <f:metadata>
        <f:viewAction action="#{loginUI.verificarAccesoAdmin}"
                      onPostback="true"/>
    </f:metadata>

    <ui:define name="contenidoAdmin">

        <h1>Usuarios</h1>
        <p>Consulta las cuentas de usuarios registradas en el sistema.</p>

        <h:form>
            <p:panel header="Usuarios registrados">

                <p:dataTable value="#{usuariosUI.usuarios}"
                             var="usuario"
                             emptyMessage="No hay usuarios registrados."
                             responsiveLayout="scroll">

                    <p:column headerText="ID">
                        <h:outputText value="#{usuario.id}"/>
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{usuario.nombre}"/>
                    </p:column>

                    <p:column headerText="Apellido paterno">
                        <h:outputText value="#{usuario.apellidoPaterno}"/>
                    </p:column>

                    <p:column headerText="Apellido materno">
                        <h:outputText value="#{usuario.apellidoMaterno}"/>
                    </p:column>

                    <p:column headerText="Correo electrónico">
                        <h:outputText value="#{usuario.correoElectronico}"/>
                    </p:column>

                    <p:column headerText="Usuario">
                        <h:outputText value="#{usuario.usuario}"/>
                    </p:column>

                </p:dataTable>

            </p:panel>
        </h:form>

    </ui:define>

</ui:composition>
