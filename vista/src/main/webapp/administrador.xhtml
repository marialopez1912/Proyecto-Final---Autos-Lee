<?xml version='1.0' encoding='UTF-8' ?>
        <!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Autos Lee - Administración</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("#{request.contextPath}/resources/auto.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .barra {
            width: 100%;
            height: 60px;
            background-color: white;
            padding: 15px;
            box-sizing: border-box;
        }

        .contenedor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            padding: 30px;
            background-color: rgba(190,190,190,0.75);
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
        }

        .botonAdmin {
            background-color: #D9D9D9 !important;
            color: black !important;
            border: 1px solid #999999 !important;
            border-radius: 3px !important;
            padding: 8px 18px !important;
            box-shadow: none !important;
            text-shadow: none !important;
            font-weight: normal !important;
            margin: 8px;
            width: 250px;
        }

        .titulo {
            font-family: Georgia;
            font-size: 25px;
        }

        .subtitulo {
            font-family: Georgia;
            font-size: 19px;
        }
    </style>

</h:head>

<h:body>

    <div class="barra">
        <table width="100%">
            <tr>
                <td width="80%">
                    <font face="Georgia" size="5">
                        Autos Lee
                    </font>
                </td>
                <td align="right">
                    <font color="black">
                        Administrador
                    </font>
                </td>
            </tr>
        </table>
    </div>

    <h:form id="formAdministrador">

        <div class="contenedor">

            <h2 class="titulo">
                Bienvenido, #{loginUI.administrador.nombre}
            </h2>

            <p class="subtitulo">
                Panel de administración
            </p>

            <p:separator />

            <p>Selecciona la opción que deseas realizar:</p>

            <br />

            <p:commandButton
                    value="Administrar usuarios"
                    styleClass="botonAdmin"
                    icon="pi pi-users" />

            <br />

            <p:commandButton
                    value="Administrar administradores"
                    styleClass="botonAdmin"
                    icon="pi pi-user-edit" />

            <br />

            <p:button
                    value="Registrar administrador"
                    styleClass="botonAdmin"
                    icon="pi pi-user-plus"
                    outcome="registroAdministrador.xhtml"
                    rendered="#{loginUI.administrador.esPrincipal}" />

            <br />

        </div>

    </h:form>

</h:body>
</html>
