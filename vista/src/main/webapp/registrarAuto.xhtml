<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/panel.xhtml">

    <ui:define name="metadata">
        <f:viewAction action="#{AutoBeanUI.nuevoRegistro()}"/>
    </ui:define>

    <ui:define name="contenidoAdmin">

        <h1>Registrar auto</h1>

        <p>Completa los datos para registrar un nuevo vehículo.</p>

        <h:form id="formAuto">

            <p:messages id="messages" showDetail="true" closable="true" autoUpdate="true"/>
            <p:wizard flowListener="#{AutoBeanUI.onFlowProcess}" backLabel="Atras" nextLabel="Siguiente">
                <p:tab id="identificacion" title="Informacion de Identificacion">
                    <p:panel header="Informacion de Identificacion">

                <!-- PESTAÑA 1 -->
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">

                            <p:outputLabel for="marca" value="Marca:"/>
                            <p:inputText id="marca" value="#{AutoBeanUI.auto.marca}" required="true"/>

                            <p:outputLabel for="modelo" value="Modelo:"/>
                            <p:inputText id="modelo" value="#{AutoBeanUI.auto.modelo}" required="true"/>

                            <p:outputLabel for="version" value="Versión:"/>
                            <p:inputText id="version" value="#{AutoBeanUI.auto.version}" required="true"/>

                            <p:outputLabel for="vin" value="VIN:"/>
                            <p:inputText id="vin" value="#{AutoBeanUI.auto.vin}" required="true"/>

                            <p:outputLabel for="placa" value="Placa:"/>
                            <p:inputText id="placa" value="#{AutoBeanUI.auto.placa}" required="true"/>

                            <p:outputLabel for="carroceria" value="Carrocería:"/>
                            <p:inputText id="carroceria" value="#{AutoBeanUI.auto.carroceria}" required="true"/>

                        </p:panelGrid>
                    </p:panel>
                </p:tab>

                <!-- PESTAÑA 2 -->
                <p:tab id="mecanicos" title="Información mecánica">
                    <p:panel header="Información mecánica">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">

                            <p:outputLabel for="tipo_motor" value="Tipo de motor:"/>
                            <p:inputText id="tipo_motor" value="#{AutoBeanUI.auto.tipoMotor}"/>

                            <p:outputLabel for="tipo_combustible" value="Combustible:"/>
                            <p:inputText id="tipo_combustible" value="#{AutoBeanUI.auto.tipoCombustible}"/>

                            <p:outputLabel for="cilindros" value="Cilindros:"/>
                            <p:inputText id="cilindros" value="#{AutoBeanUI.auto.cilindros}"/>

                            <p:outputLabel for="potencia_maxima" value="Potencia máxima:"/>
                            <p:inputText id="potencia_maxima" value="#{AutoBeanUI.auto.potenciaMaxima}"/>

                            <p:outputLabel for="transmision" value="Transmisión:"/>
                            <p:inputText id="transmision" value="#{AutoBeanUI.auto.transmision}"/>

                            <p:outputLabel for="frenos" value="Frenos:"/>
                            <p:inputText id="frenos" value="#{AutoBeanUI.auto.frenos}"/>

                            <p:outputLabel for="suspension" value="Suspensión:"/>
                            <p:inputText id="suspension" value="#{AutoBeanUI.auto.suspension}"/>

                        </p:panelGrid>
                    </p:panel>
                </p:tab>

                <!-- PESTAÑA 3 -->
                <p:tab id="venta" title="Información de venta">
                    <p:panel header="Información de venta">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">

                            <p:outputLabel for="precio_compra" value="Precio de compra:"/>
                            <p:inputText id="precio_compra" value="#{AutoBeanUI.auto.precioCompra}"/>

                            <p:outputLabel for="porcentaje_ganancia" value="Ganancia (%):" />
                            <p:inputText id="porcentaje_ganancia" value="#{AutoBeanUI.auto.porcentajeGanancia}" />

                        </p:panelGrid>
                    </p:panel>
                </p:tab>

                <!-- PESTAÑA 4 -->

                <p:tab id="confirmacion" title="Confirmar registro">
                    <p:panel header="Confirmar registro">
                        <h:panelGrid columns="2" columnClasses="label, value">

                            <h:outputText value="Precio de venta: "/>
                            <h:outputText value="#{AutoBeanUI.precioVentaCalculado}">
                                <f:convertNumber type="currency" currencySymbol="$"/>
                            </h:outputText>

                            <p:commandButton value="Guardar auto"
                                             actionListener="#{AutoBeanUI.guardar()}" update="messages btnEquipamiento" />

                            <p:button id="btnEquipamiento" value="Registrar Equipamientos" outcome="registrarEquipamiento.xhtml" disabled="#{!AutoBeanUI.autoGuardado}"/>

                            <h:link outcome="panel.xhtml" value="Regresar al menu"/>
                        </h:panelGrid>
                    </p:panel>
                </p:tab>

            </p:wizard>
        </h:form>

    </ui:define>

</ui:composition>
