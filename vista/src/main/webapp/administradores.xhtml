<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/panel.xhtml">

    <f:metadata>
        <f:viewAction action="#{loginUI.verificarAccesoAdmin}"
                      onPostback="true"/>
    </f:metadata>

    <ui:define name="contenidoAdmin">

        <h1>Administradores</h1>
        <p>Consulta las cuentas administrativas registradas en el sistema.</p>

        <h:form>
            <p:panel header="Administradores registrados">

                <p:dataTable value="#{administradoresUI.administradores}"
                             var="admin"
                             emptyMessage="No hay administradores registrados."
                             responsiveLayout="scroll">

                    <p:column headerText="ID">
                        <h:outputText value="#{admin.id}"/>
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{admin.nombre}"/>
                    </p:column>

                    <p:column headerText="Apellido paterno">
                        <h:outputText value="#{admin.apellidoPaterno}"/>
                    </p:column>

                    <p:column headerText="Correo">
                        <h:outputText value="#{admin.correoElectronico}"/>
                    </p:column>

                    <p:column headerText="Teléfono">
                        <h:outputText value="#{admin.numeroTelefonico}"/>
                    </p:column>

                    <p:column headerText="Usuario">
                        <h:outputText value="#{admin.usuario}"/>
                    </p:column>

                    <p:column headerText="Administrador principal">
                        <h:outputText value="#{admin.esPrincipal ? 'Sí' : 'No'}"/>
                    </p:column>

                </p:dataTable>
            </p:panel>
        </h:form>

    </ui:define>

</ui:composition>
