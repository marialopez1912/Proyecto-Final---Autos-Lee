<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/panel.xhtml">

    <ui:define name="contenidoAdmin">

        <h1>Equipamiento del auto</h1>

        <p>Selecciona el equipamiento tecnológico y de seguridad del vehículo.</p>

        <h:form id="formEquipamiento">

            <p:messages id="messages" showDetail="true" closable="true" autoUpdate="true"/>

            <p:panel header="Equipamiento tecnológico" style="margin-bottom:20px;">

                <p:selectManyCheckbox value="#{AutoExtrasBeanUI.equipamientoSeleccionado}"
                                      layout="grid"
                                      columns="2">
                    <f:selectItems value="#{AutoExtrasBeanUI.opcionesEquipamiento}"/>
                </p:selectManyCheckbox>

                <div class="ui-fluid" style="margin-top:20px;">
                    <p:outputLabel for="AdicionalesTecnologico"
                                   value="Escribe otros elementos tecnológicos:"/>
                    <p:chips id="AdicionalesTecnologico"
                             value="#{AutoExtrasBeanUI.equipamientoExtra}"/>
                </div>

                <div style="text-align:center; margin-top:20px;">
                    <p:commandButton value="Guardar equipamiento tecnológico"
                                     icon="pi pi-save"
                                     actionListener="#{AutoExtrasBeanUI.guardarEquipamiento()}"
                                     update="@form"/>
                </div>

            </p:panel>

            <p:panel header="Equipamiento de seguridad">

                <p:selectManyCheckbox value="#{AutoExtrasBeanUI.seguridadSeleccionado}"
                                      layout="grid"
                                      columns="2">
                    <f:selectItems value="#{AutoExtrasBeanUI.opcionesSeguridad}"/>
                </p:selectManyCheckbox>

                <div class="ui-fluid" style="margin-top:20px;">
                    <p:outputLabel for="AdicionalesSeguridad"
                                   value="Escribe otros elementos de seguridad:"/>
                    <p:chips id="AdicionalesSeguridad"
                             value="#{AutoExtrasBeanUI.seguridadExtra}"/>
                </div>

                <div style="text-align:center; margin-top:20px;">
                    <p:commandButton value="Guardar equipamiento de seguridad"
                                     icon="pi pi-save"
                                     actionListener="#{AutoExtrasBeanUI.guardarSeguridad()}"
                                     update="@form"/>
                </div>

            </p:panel>

            <div style="text-align:center; margin-top:20px;">
                <p:button value="Regresar al menú"
                          outcome="panel.xhtml"
                          icon="pi pi-times"
                          styleClass="ui-button-secondary"/>
            </div>

        </h:form>

    </ui:define>

</ui:composition>
