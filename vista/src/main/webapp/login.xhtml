<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<style>
    body {
        margin: 0;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Segoe UI", Arial, sans-serif;
        background-image: url("#{request.contextPath}/resources/autos.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .barra {
        height: 64px;
        padding: 0 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        border-bottom: 3px solid #d9dce1;
    }

    .marca {
        font-family: Georgia, serif;
        font-size: 27px;
        font-weight: bold;
        color: #2b2d31;
    }

    .enlaceRegistro {
        padding: 8px 22px;
        border: 1.5px solid #2b2d31;
        border-radius: 999px;
        color: #2b2d31;
        font-weight: 600;
        text-decoration: none;
    }

    .enlaceRegistro:hover {
        background: #2b2d31;
        color: white;
    }

    .login {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 480px;
        max-width: 92%;
        padding: 62px 34px 32px;
        box-sizing: border-box;
        background: rgba(190, 190, 190, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 8px;
        text-align: center;
        color: #1f2125;
    }

    .imagenUsuario {
        position: absolute;
        width: 90px;
        height: 90px;
        top: -45px;
        left: 50%;
        transform: translateX(-50%);
    }

    .login h2 {
        margin: 0 0 6px;
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: normal;
    }

    .subtitulo {
        margin: 0 0 24px;
        font-size: 14px;
        color: #3b3e44;
    }

    .etiqueta {
        margin: 18px 0 7px;
        text-align: left;
        font-size: 14px;
        font-weight: 600;
    }

    .campo {
        width: 100%;
        padding: 12px 14px;
        box-sizing: border-box;
        font-size: 15px;
        color: #25272b;
        background: white;
        border: 1px solid #aeb2b9;
        border-radius: 6px;
        user-select: text;
        -webkit-user-select: text;
    }

    .botonLogin {
        width: 100%;
        margin-top: 24px;
        padding: 13px !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        color: white !important;
        background: #3a3d42 !important;
        border: 1px solid #2b2d31 !important;
        border-radius: 6px !important;
        cursor: pointer;
    }

    .botonLogin:hover {
        background: #55585e !important;
    }

    .mensajes {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 320px;
        z-index: 1000;
        user-select: none;
    }

    .mensajes > div {
        position: relative;
        padding: 14px 44px 14px 18px;
        background: #2b2d31;
        color: white;
        border-radius: 6px;
    }

    .mensajes ul {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .mensajes [class*="summary"] {
        display: block;
        font-weight: bold;
    }

    .mensajes [class*="detail"] {
        display: block;
        font-size: 13px;
        color: #c3c7ce;
    }

    .mensajes [class*="icon"] {
        display: none;
    }

    .mensajes .ui-messages-close {
        position: absolute;
        top: 8px;
        right: 12px;
        color: white;
        font-size: 22px;
        text-decoration: none;
        cursor: pointer;
    }

    .mensajes .ui-messages-close::after {
        content: "\00d7";
    }
</style>

<h:body>

    <div class="barra">
        <span class="marca">Autos Lee</span>
        <a href="registroUS.xhtml" class="enlaceRegistro">Regístrate</a>
    </div>

    <h:form>

        <p:messages id="messages"
                    styleClass="mensajes"
                    showDetail="true"
                    closable="true" />

        <div class="login">

            <p:graphicImage value="/resources/users.png"
                            styleClass="imagenUsuario" />

            <h2>Iniciar sesión</h2>
            <p class="subtitulo">Ingresa tu correo y contraseña para continuar.</p>

            <div class="etiqueta">
                <h:outputLabel value="Correo:" />
            </div>

            <p:inputText styleClass="campo"
                         placeholder="Escribe tu correo"
                         autocomplete="off"
                         value="#{loginUI.usuario.correoElectronico}" />

            <div class="etiqueta">
                <h:outputLabel value="Contraseña:" />
            </div>

            <p:password styleClass="campo"
                        placeholder="Escribe tu contraseña"
                        value="#{loginUI.usuario.contrasenia}" />

            <p:commandButton value="Iniciar Sesión"
                             styleClass="botonLogin"
                             update="messages"
                             actionListener="#{loginUI.login()}" />

        </div>

    </h:form>

    <script type="text/javascript">
        document.addEventListener('click', function (e) {
            var x = e.target.closest('.ui-messages-close');
            if (x) {
                e.preventDefault();
                x.parentNode.style.display = 'none';
            }
        });
    </script>

</h:body>

</html>
