<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">


<style>
    body {
        margin: 0;
        padding: 0;
        background-image: url("#{request.contextPath}/resources/auto.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .barra {
        width: 100%;
        height: 60px;
        background-color: white;
        padding: 15px;
        box-sizing: border-box;
    }

    .login {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        padding: 25px;
        background-color: rgba(190,190,190,0.65);
        border-radius: 5px;
        text-align: center;
        box-sizing: border-box;
    }

    .imagenUsuario {
        position: absolute;
        width: 80px;
        height: 80px;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        filter: brightness(0);
    }

    .botonLogin {
        background-color: #D9D9D9 !important;
        color: black !important;
        border: 1px solid #999999 !important;
        border-radius: 3px !important;
        padding: 6px 18px !important;
        box-shadow: none !important;
        text-shadow: none !important;
        font-weight: normal !important;
    }

    .campo {
        width: 100%;
        box-sizing: border-box;
    }
</style>



<h:body>


    <div class="barra">

        <table width="100%">
            <tr>
                <td width="80%">
                    <font face="Georgia" size="5">
                        Autos Lee
                    </font>
                </td>

                <td align="center">
                    <a href="registroUS.xhtml">
                        <font color="black">
                            Regístrate
                        </font>
                    </a>
                </td>
            </tr>
        </table>

    </div>


    <h:form>

            <p:messages id="messages"
                        showDetail="true"
                        closable="true" />

            <div class="login">

                <p:graphicImage
                        value="/resources/user.png"
                        styleClass="imagenUsuario" />

                <h2>Iniciar Sesión</h2>


                <div align="left">
                    <h:outputLabel value="Correo:" />
                </div>

                <p:inputText
                        styleClass="campo"
                        placeholder="Escribe tu correo"
                        autocomplete="off"
                        value="#{loginUI.usuario.correoElectronico}" />

                <br />
                <br />

                <div align="left">
                    <h:outputLabel value="Contraseña:" />
                </div>

                <p:password
                        styleClass="campo"
                        placeholder="Escribe tu contraseña"
                        value="#{loginUI.usuario.contrasenia}" />

                <br />
                <br />


                <p:commandButton
                        value="Iniciar Sesión"
                        styleClass="botonLogin"
                        update="messages"
                        actionListener="#{loginUI.login()}" />

            </div>

        </h:form>

    </h:body>


</html>
