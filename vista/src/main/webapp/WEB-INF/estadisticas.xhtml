<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/plantilla.xhtml">

    <ui:define name="metadata">
        <f:viewAction action="#{estadisticasUI.iniciar}"/>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h2>Estadísticas generales de ventas</h2>

            <h:panelGroup rendered="#{empty estadisticasUI.anuales}" layout="block" styleClass="aviso">
                <i class="pi pi-chart-bar"></i>
                <span>Aún no hay ventas para mostrar estadísticas.</span>
            </h:panelGroup>

            <ui:repeat value="#{estadisticasUI.anuales}" var="v">
                <div class="barra-fila">
                    <span class="barra-etiqueta">#{v.anio} <small>(#{v.cantidad} autos)</small></span>
                    <div class="barra-fondo">
                        <div class="barra" style="width: #{estadisticasUI.porcentaje(v)}%"></div>
                    </div>
                    <span class="barra-monto">
                        <h:outputText value="#{v.total}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </span>
                </div>
            </ui:repeat>

            <h:panelGroup rendered="#{not empty estadisticasUI.anuales}" layout="block" styleClass="total-general">
                Total vendido:
                <h:outputText value="#{estadisticasUI.total}">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>
                en #{estadisticasUI.cantidad} autos
            </h:panelGroup>
        </div>
    </ui:define>
</ui:composition>
