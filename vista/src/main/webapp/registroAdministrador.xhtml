<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/panel.xhtml">

    <ui:define name="contenidoAdmin">

        <h1>Registrar administrador</h1>

        <p>Completa los datos para crear una nueva cuenta administrativa.</p>

        <h:form id="formRegistro">

            <p:messages id="messages"
                        showDetail="true"
                        closable="true"/>

            <p:panel header="Datos del administrador">

                <p:panelGrid columns="2"
                             layout="grid"
                             styleClass="ui-fluid">

                    <p:outputLabel value="Nombre:"/>
                    <p:inputText value="#{registroAdminUI.administrador.nombre}"
                                 required="true"
                                 requiredMessage="Ingresa el nombre."/>

                    <p:outputLabel value="Apellido paterno:"/>
                    <p:inputText value="#{registroAdminUI.administrador.apellidoPaterno}"
                                 required="true"
                                 requiredMessage="Ingresa el apellido paterno."/>

                    <p:outputLabel value="Apellido materno:"/>
                    <p:inputText value="#{registroAdminUI.administrador.apellidoMaterno}"/>

                    <p:outputLabel value="Correo electrónico:"/>
                    <p:inputText value="#{registroAdminUI.administrador.correoElectronico}"
                                 required="true"
                                 requiredMessage="Ingresa el correo electrónico."/>

                    <p:outputLabel value="Número telefónico:"/>
                    <p:inputText value="#{registroAdminUI.administrador.numeroTelefonico}"
                                 required="true"
                                 requiredMessage="Ingresa el teléfono."/>

                    <p:outputLabel value="Usuario:"/>
                    <p:inputText value="#{registroAdminUI.administrador.usuario}"
                                 required="true"
                                 requiredMessage="Ingresa el nombre de usuario."/>

                    <p:outputLabel value="Contraseña:"/>
                    <p:password value="#{registroAdminUI.administrador.contrasenia}"
                                required="true"
                                requiredMessage="Ingresa una contraseña."/>

                    <p:outputLabel value="Confirmar contraseña:"/>
                    <p:password value="#{registroAdminUI.confirmarContrasenia}"
                                required="true"
                                requiredMessage="Confirma la contraseña."/>

                </p:panelGrid>

                <div style="text-align:center; margin-top:20px;">

                    <p:commandButton value="Registrar"
                                     icon="pi pi-save"
                                     action="#{registroAdminUI.registrar}"
                                     update="@form"/>

                    <p:button value="Cancelar"
                              outcome="panel.xhtml"
                              icon="pi pi-times"
                              styleClass="ui-button-secondary"/>

                </div>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
