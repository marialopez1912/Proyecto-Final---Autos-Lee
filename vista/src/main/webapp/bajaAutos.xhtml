<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Buscar autos</title>
    <style>
        .container{max-width: 900px; margin: 30px auto; padding: 0 16px;}
        .buscador{display: flex; gap: 10px; margin-bottom: 20px;}
    </style>
</h:head>

<h:body>
    <div class="container">


         <h2>Buscar autos</h2>

        <h:form id="formBuscar">
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="buscador">
                <p:inputText id="vin" placeholder="Escribe un VIN" value="#{AutoBeanUI.vinBusqueda}"/>
                <p:commandButton value="Buscar" actionListener="#{AutoBeanUI.buscar()}" update="tablaAutos messages"/>
            </div>

            <p:dataTable id="tablaAutos" var="a" value="#{AutoBeanUI.listaAutos}" selectionMode="single" selection="#{AutoBeanUI.autoSeleccionado}" rowKey="#{a.vin}" emptyMessage="No se encontraron autos" >
                <p:column headerText="VIN"><h:outputText value="#{a.vin}"/></p:column>
                <p:column headerText="Marca"><h:outputText value="#{a.marca}"/></p:column>
                <p:column headerText="Modelo"><h:outputText value="#{a.modelo}"/></p:column>
                <p:column headerText="Año"><h:outputText value="#{a.anio}"/></p:column>
                <p:column headerText="Estado"><h:outputText value="#{a.disponible ? 'A la venta' : 'Dado de baja'}"/></p:column>
            </p:dataTable>

            <br />

            <p:commandButton value="Dar de baja" actionListener="#{AutoBeanUI.darDeBajaAuto()}" update="tablaAutos messages">
                <p:confirm header="Confirmar" message="¿Seguro de eliminar este auto?" />

            </p:commandButton>

            <p:confirmDialog global="true">
                <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" />
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" />
            </p:confirmDialog>
        </h:form>
    </div>
</h:body>
</html>
