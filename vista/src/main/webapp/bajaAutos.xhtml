<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/panel.xhtml">

    <ui:define name="contenidoAdmin">

        <h1>Buscar autos</h1>

        <p>Busca un vehículo por su VIN y gestiona su baja.</p>

        <h:form id="formBuscar">

            <p:messages id="messages" showDetail="true" closable="true"/>

            <p:panel header="Búsqueda de autos">

                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <p:inputText id="vin"
                                 placeholder="Escribe un VIN"
                                 value="#{AutoBeanUI.vinBusqueda}"
                                 style="flex:1;"/>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     actionListener="#{AutoBeanUI.buscar()}"
                                     update="tablaAutos messages"/>
                </div>

                <p:dataTable id="tablaAutos"
                             var="a"
                             value="#{AutoBeanUI.listaAutos}"
                             selectionMode="single"
                             selection="#{AutoBeanUI.autoSeleccionado}"
                             rowKey="#{a.vin}"
                             emptyMessage="No se encontraron autos">

                    <p:column headerText="VIN">
                        <h:outputText value="#{a.vin}"/>
                    </p:column>
                    <p:column headerText="Marca">
                        <h:outputText value="#{a.marca}"/>
                    </p:column>
                    <p:column headerText="Modelo">
                        <h:outputText value="#{a.modelo}"/>
                    </p:column>
                    <p:column headerText="Año">
                        <h:outputText value="#{a.anio}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <h:outputText value="#{a.disponible ? 'A la venta' : 'Dado de baja'}"/>
                    </p:column>
                </p:dataTable>

                <div style="text-align:center; margin-top:20px;">
                    <p:commandButton value="Dar de baja"
                                     icon="pi pi-trash"
                                     actionListener="#{AutoBeanUI.darDeBajaAuto()}"
                                     update="tablaAutos messages">
                        <p:confirm header="Confirmar" message="¿Seguro de eliminar este auto?"/>
                    </p:commandButton>

                    <p:button value="Cancelar"
                              outcome="panel.xhtml"
                              icon="pi pi-times"
                              styleClass="ui-button-secondary"/>
                </div>

            </p:panel>

            <p:confirmDialog global="true">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no"/>
            </p:confirmDialog>

        </h:form>

    </ui:define>

</ui:composition>
